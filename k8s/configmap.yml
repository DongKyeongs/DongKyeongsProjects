apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-config
data:
  database.url: "jdbc:mysql://mysql-service:3306/exchange?useSSL=false&serverTimezone=UTC"
  redis.host: "redis-service"
  redis.port: "6379"
  application.yml: |
    spring:
      application:
        name: crypto-exchange
      datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            format_sql: false
            dialect: org.hibernate.dialect.MySQL8Dialect
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true
      redis:
        host: ${SPRING_REDIS_HOST}
        port: ${SPRING_REDIS_PORT}
        password: ${SPRING_REDIS_PASSWORD}
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
            max-wait: -1ms

    jwt:
      secret: ${JWT_SECRET}
      expirationTime: 86400000

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: when-authorized
      metrics:
        export:
          prometheus:
            enabled: true
