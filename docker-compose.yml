version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: exchange-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: exchange
      MYSQL_USER: exchange_user
      MYSQL_PASSWORD: exchange_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - exchange-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: exchange-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - exchange-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/exchange?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: exchange_user
      SPRING_DATASOURCE_PASSWORD: exchange_pass
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-here-must-be-at-least-32-characters-long-for-production
      JWT_EXPIRATION_TIME: 86400000
    ports:
      - "8080:8080"
    networks:
      - exchange-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exchange-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - exchange-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  exchange-network:
    driver: bridge
