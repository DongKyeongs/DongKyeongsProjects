spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/exchange?useSSL=false&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:exchange_user}
    password: ${DATABASE_PASSWORD:exchange_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expirationTime: ${JWT_EXPIRATION_TIME:86400000}

server:
  port: 8080

logging:
  level:
    com.dkp.exchange: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
  file:
    name: /var/log/exchange/application.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
