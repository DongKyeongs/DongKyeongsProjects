spring:
  datasource:
    url: jdbc:mysql://localhost:3306/exchange?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: localhost
    port: 6379

jwt:
  secret: dev-secret-key-for-testing-only-32-chars
  expirationTime: 86400000

server:
  port: 8080

logging:
  level:
    com.dkp.exchange: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
