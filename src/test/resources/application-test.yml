spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379

jwt:
  secret: test-secret-key-for-testing-only-32-characters-long
  expirationTime: 86400000

logging:
  level:
    com.dkp.exchange: DEBUG
